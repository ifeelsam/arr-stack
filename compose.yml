version: "3.8"

networks:
  rstack_network:
    name: rstack_network
    driver: bridge

services:
  # 1. The Downloader
  qbittorrent:
    image: lscr.io/linuxserver/qbittorrent:latest
    container_name: qbittorrent
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Etc/UTC
      - WEBUI_PORT=8080
    volumes:
      - ./config/qbittorrent:/config
      - ./torrents:/downloads        # Active downloads stay inside arrstack
      - ~/jellyfin/movies/:/media
    ports:
      - 8080:8080
      - 6881:6881
      - 6881:6881/udp
    networks:
      - rstack_network
    restart: unless-stopped

  # 2. The Movie Manager
  radarr:
    image: lscr.io/linuxserver/radarr:latest
    container_name: radarr
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Etc/UTC
    volumes:
      - ./config/radarr:/config
      - ./torrents:/downloads        # Radarr watches the arrstack downloads folder
      - ~/jellyfin/movies/movie:/movies  # Routes finalized movies to your locked Jellyfin path
      - ~/jellyfin/movies/:/media
    ports:
      - 7878:7878
    networks:
      - rstack_network
    restart: unless-stopped

  # 3. The TV Show Manager
  sonarr:
    image: lscr.io/linuxserver/sonarr:latest
    container_name: sonarr
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Etc/UTC
    volumes:
      - ./config/sonarr:/config
      - ./torrents:/downloads        # Sonarr watches the arrstack downloads folder
      - ~/jellyfin/movies/tv:/tv 
      - ~/jellyfin/movies/:/media # Routes finalized TV shows to your locked Jellyfin path
    ports:
      - 8989:8989
    networks:
      - rstack_network
    restart: unless-stopped

  # 4. The Torrent Tracker Manager
  prowlarr:
    image: lscr.io/linuxserver/prowlarr:latest
    container_name: prowlarr
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Etc/UTC
    volumes:
      - ./config/prowlarr:/config
    ports:
      - 9696:9696
    networks:
      - rstack_network
    restart: unless-stopped

  # 5. The Request Front-End
  jellyseerr:
    image: seerr/seerr:latest
    container_name: jellyseerr
    environment:
      - TZ=Etc/UTC
    volumes:
      - ./config/jellyseerr:/app/config
    ports:
      - 5055:5055
    networks:
      - rstack_network
    restart: unless-stopped

  # 6. flaresolverr for adding solving new torents 
  flaresolverr:
    image: ghcr.io/flaresolverr/flaresolverr:latest
    container_name: flaresolverr
    environment:
      - LOG_LEVEL=${LOG_LEVEL:-info}
      - LOG_HTML=${LOG_HTML:-false}
      - CAPTCHA_SOLVER=${CAPTCHA_SOLVER:-none}
      - TZ=Europe/London
    ports:
      - 8191:8191
    networks: 
      - rstack_network
    restart: unless-stopped
